name: Build APK

# 由 Loom Build 自动生成。若项目自带构建流水线，可以保留本文件作为兜底。
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 直接用 runner 预装的 SDK。刻意避开 android-actions/setup-android：
      # 它内部会执行 `sdkmanager tools`，而该包已从 SDK 源中移除，会导致步骤直接失败。
      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?ANDROID_HOME not set by runner image}"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | sort | tail -1)
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          for pkg in "platform-tools" "platforms;android-34" "platforms;android-35" \
                     "platforms;android-36" "build-tools;34.0.0" "build-tools;35.0.0"; do
            echo "--- $pkg"
            "$SDKMANAGER" --install "$pkg" || true
          done
          ls "$ANDROID_HOME/platforms" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Assemble
        run: |
          set -euo pipefail
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon --stacktrace assembleDebug assembleRelease
          else
            gradle --no-daemon --stacktrace assembleDebug assembleRelease
          fi

      - name: Collect APKs
        run: |
          set -euo pipefail
          mkdir -p out
          find . -path '*/build/outputs/apk/*' -name '*.apk' -exec cp {} out/ \;
          ls -l out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/
          if-no-files-found: error
