name: Build APK

# 由 Loom Build 自动生成。首次构建会生成签名密钥并提交到 .loom/signing/，
# 之后所有构建复用同一把密钥，保证升级覆盖安装不会签名冲突。
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 直接用 runner 预装的 SDK。刻意避开 android-actions/setup-android：
      # 它内部会执行 `sdkmanager tools`，该包已从 SDK 源移除，会让步骤直接失败。
      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?ANDROID_HOME not set by runner image}"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | sort | tail -1)
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          for pkg in "platform-tools" "platforms;android-34" "platforms;android-35" \
                     "platforms;android-36" "build-tools;34.0.0" "build-tools;35.0.0"; do
            echo "--- $pkg"
            "$SDKMANAGER" --install "$pkg" || true
          done
          ls "$ANDROID_HOME/platforms" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Assemble
        run: |
          set -euo pipefail
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon --stacktrace assembleDebug assembleRelease
          else
            gradle --no-daemon --stacktrace assembleDebug assembleRelease
          fi

      - name: Sign release APK
        run: |
          set -euo pipefail
          KS_DIR=.loom/signing
          if [ ! -f "$KS_DIR/keystore.p12" ]; then
            echo "第一次构建：生成签名密钥"
            mkdir -p "$KS_DIR"
            PASS=$(head -c 32 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 24)
            keytool -genkeypair -noprompt \
              -keystore "$KS_DIR/keystore.p12" -storetype PKCS12 \
              -alias loom -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=Loom Build,O=Loom Build,C=CN"
            printf 'storePassword=%s\nkeyPassword=%s\nalias=loom\n' "$PASS" "$PASS" > "$KS_DIR/signing.properties"
            git config user.name "loom-build"
            git config user.email "loom-build@users.noreply.github.com"
            git add "$KS_DIR"
            git commit -m "chore: add signing key [skip ci]"
            git push
          fi

          set -a
          . "$KS_DIR/signing.properties"
          set +a

          UNSIGNED=$(find . -path '*/build/outputs/apk/release/*.apk' -name '*unsigned*.apk' | head -1)
          if [ -z "$UNSIGNED" ]; then
            echo "没有未签名的 release 产物，跳过签名（项目可能已自带签名配置）"
            exit 0
          fi

          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "build-tools: $BT"
          mkdir -p out
          "$BT/zipalign" -p -f 4 "$UNSIGNED" out/app-release-signed.apk
          "$BT/apksigner" sign \
            --ks "$KS_DIR/keystore.p12" --ks-type PKCS12 \
            --ks-key-alias "$alias" \
            --ks-pass "pass:$storePassword" --key-pass "pass:$keyPassword" \
            out/app-release-signed.apk
          "$BT/apksigner" verify --print-certs out/app-release-signed.apk | head -4

      - name: Collect APKs
        run: |
          set -euo pipefail
          mkdir -p out
          find . -path '*/build/outputs/apk/*' -name '*.apk' -exec cp {} out/ \;
          ls -l out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/
          if-no-files-found: error
